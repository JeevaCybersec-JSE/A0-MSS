/* ==========================================================================
   BRYSA MSS EXECUTIVE CLIENT INTELLIGENCE PORTAL
   State-of-the-Art Executive UI Design System
   ========================================================================== */

:root {
  /* Base Theme: Executive Obsidian & Crisp White */
  --font-sans: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
  
  --bg: #f8fafc;
  --bg-subtle: #f1f5f9;
  --surface: #ffffff;
  --surface-glass: rgba(255, 255, 255, 0.88);
  --surface-card: #ffffff;
  --surface-card-hover: #fcfdfe;
  --surface-inner: #f8fafc;
  --line: #e2e8f0;
  --line-subtle: #edf2f7;
  
  --tx: #0f172a;
  --tx-heading: #090d16;
  --tx-muted: #64748b;
  --tx-dim: #94a3b8;
  
  /* Executive Brand & Semantic Palette */
  --brand: #2563eb;
  --brand-glow: rgba(37, 99, 235, 0.15);
  --gold: #d97706;
  --gold-glow: rgba(217, 119, 6, 0.15);
  
  --g: #059669;
  --g-light: #10b981;
  --gs: #ecfdf5;
  --g-border: #a7f3d0;
  
  --a: #d97706;
  --a-light: #f59e0b;
  --as: #fffbeb;
  --a-border: #fde68a;
  
  --r: #dc2626;
  --r-light: #ef4444;
  --rs: #fef2f2;
  --r-border: #fecaca;
  
  --n: #64748b;
  --ns: #f1f5f9;
  --n-border: #e2e8f0;
  
  --navy: #0f2557;
  --ink: #1e293b;
  --muted: #64748b;
  --accent: #2563eb;
  --accent-soft: rgba(37, 99, 235, 0.08);
  --g-soft: rgba(16, 185, 129, 0.12);
  --a-soft: rgba(245, 158, 11, 0.12);
  --r-soft: rgba(239, 68, 68, 0.12);
  --n-soft: rgba(148, 163, 184, 0.12);
  --line-soft: #f1f5f9;
  --s1: #163270;
  --s2: #5c7fd1;
  --s3: #e07a5f;

  --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
  --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -2px rgba(15, 23, 42, 0.03);
  --shadow-lg: 0 12px 28px -6px rgba(15, 23, 42, 0.09), 0 4px 10px -2px rgba(15, 23, 42, 0.04);
  --shadow-xl: 0 20px 40px -12px rgba(15, 23, 42, 0.15);
  --shadow-drawer: -24px 0 60px rgba(15, 23, 42, 0.22);
  
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;
}

[data-theme="dark"] {
  --bg: #090c12;
  --bg-subtle: #0d1118;
  --surface: #10141d;
  --surface-glass: rgba(16, 20, 29, 0.88);
  --surface-card: #121620;
  --surface-card-hover: #161c28;
  --surface-inner: #0b0f16;
  --line: rgba(255, 255, 255, 0.08);
  --line-subtle: rgba(255, 255, 255, 0.05);
  
  --tx: #f1f5f9;
  --tx-heading: #ffffff;
  --tx-muted: #94a3b8;
  --tx-dim: #64748b;
  
  --navy: #e2e8f0;
  --ink: #f8fafc;
  --muted: #94a3b8;
  --accent: #3b82f6;
  --accent-soft: rgba(59, 130, 246, 0.16);
  --g-soft: rgba(16, 185, 129, 0.16);
  --a-soft: rgba(245, 158, 11, 0.16);
  --r-soft: rgba(239, 68, 68, 0.18);
  --n-soft: rgba(148, 163, 184, 0.14);
  --line-soft: rgba(255, 255, 255, 0.07);
  --s1: #3b82f6;
  --s2: #60a5fa;
  --s3: #f87171;
  
  --brand: #3b82f6;
  --brand-glow: rgba(59, 130, 246, 0.22);
  --gold: #f59e0b;
  --gold-glow: rgba(245, 158, 11, 0.2);
  
  --g: #10b981;
  --g-light: #34d399;
  --gs: rgba(16, 185, 129, 0.14);
  --g-border: rgba(16, 185, 129, 0.3);
  
  --a: #f59e0b;
  --a-light: #fbbf24;
  --as: rgba(245, 158, 11, 0.14);
  --a-border: rgba(245, 158, 11, 0.3);
  
  --r: #ef4444;
  --r-light: #f87171;
  --rs: rgba(239, 68, 68, 0.16);
  --r-border: rgba(239, 68, 68, 0.35);
  
  --n: #94a3b8;
  --ns: rgba(148, 163, 184, 0.12);
  --n-border: rgba(148, 163, 184, 0.22);
  
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
  --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 14px 32px rgba(0, 0, 0, 0.55);
  --shadow-xl: 0 24px 50px rgba(0, 0, 0, 0.7);
  --shadow-drawer: -24px 0 60px rgba(0, 0, 0, 0.75);
}

/* Reset & Base */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--tx);
  font-family: var(--font-sans);
  font-size: 13.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-variant-numeric: tabular-nums lining-nums;
  padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  transition: background-color 0.25s ease, color 0.25s ease;
}

/* ==========================================================================
   TOP UTILITY STRIP & HERO SECTION
   ========================================================================== */
.top-strip {
  background: #060b14;
  color: #94a3b8;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  padding: 8px 24px;
  font-size: 12px;
  font-weight: 500;
}

.top-strip-inner {
  max-width: 1320px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.top-strip-left {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.brand-monogram-badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  padding: 0 !important;
}

.brand-monogram-badge .brand-a0-img {
  width: 28px;
  height: 28px;
  object-fit: contain;
  display: block;
}

.telemetry-pulse-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 3px 10px;
  background: rgba(16, 185, 129, 0.12);
  border: 1px solid rgba(16, 185, 129, 0.3);
  border-radius: var(--radius-full);
  color: #34d399;
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.04em;
}

.pulse-dot {
  width: 6.5px;
  height: 6.5px;
  background: #10b981;
  border-radius: 50%;
  box-shadow: 0 0 8px #10b981;
  animation: pulseGlow 2s infinite;
}

@keyframes pulseGlow {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.45; transform: scale(0.85); }
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.period-control-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: var(--radius-sm);
  padding: 2px 6px;
}

.year-btn {
  background: transparent;
  border: none;
  color: #94a3b8;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 4px;
  transition: all 0.15s ease;
  line-height: 1;
}

.year-btn:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.12);
}

.year-val {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  color: #f8fafc;
  letter-spacing: 0.05em;
  padding: 0 4px;
}

.action-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: var(--radius-sm);
  color: #e2e8f0;
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s ease;
}

.action-btn:hover {
  background: rgba(255, 255, 255, 0.16);
  color: #ffffff;
  transform: translateY(-1px);
}

.action-btn.primary {
  background: #2563eb;
  border-color: #3b82f6;
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
}

.action-btn.primary:hover {
  background: #1d4ed8;
}

/* ==========================================================================
   FROSTED GLASS LIQUID THEME TOGGLE (Exact Chrome UI Reference)
   ========================================================================== */
.theme-glass-toggle {
  background: transparent;
  border: none;
  padding: 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  position: relative;
  outline: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  vertical-align: middle;
}

.tgt-track {
  position: relative;
  display: inline-flex;
  align-items: center;
  width: 98px;
  height: 34px;
  border-radius: 9999px;
  background: rgba(22, 24, 28, 0.92);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.16);
  box-shadow:
    inset 0 1px 2px rgba(255, 255, 255, 0.12),
    inset 0 -1.5px 2px rgba(0, 0, 0, 0.5),
    0 4px 14px rgba(0, 0, 0, 0.35);
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  overflow: visible;
}

.theme-glass-toggle:hover .tgt-track {
  border-color: rgba(255, 255, 255, 0.28);
  box-shadow:
    inset 0 1px 2px rgba(255, 255, 255, 0.18),
    inset 0 -1.5px 2px rgba(0, 0, 0, 0.5),
    0 6px 18px rgba(0, 0, 0, 0.45);
}

/* Glass Spherical Knob (Default Light mode: Obsidian glass sphere on left with Moon) */
.tgt-knob {
  position: absolute;
  top: 50%;
  left: -5px;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(68, 76, 90, 0.95) 0%, rgba(30, 34, 42, 0.98) 55%, rgba(14, 16, 20, 1) 100%);
  border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow:
    inset 0 3px 2.5px rgba(255, 255, 255, 0.6),
    inset 0 -2.5px 3px rgba(0, 0, 0, 0.75),
    inset 2.5px 0 3px rgba(255, 255, 255, 0.35),
    0 8px 22px rgba(0, 0, 0, 0.55),
    0 2px 6px rgba(0, 0, 0, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: left 0.35s cubic-bezier(0.34, 1.45, 0.64, 1), transform 0.2s ease, background 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
  z-index: 2;
}

.theme-glass-toggle:hover .tgt-knob {
  box-shadow:
    inset 0 3px 2.5px rgba(255, 255, 255, 0.7),
    inset 0 -2.5px 3px rgba(0, 0, 0, 0.75),
    0 10px 26px rgba(0, 0, 0, 0.65),
    0 2px 8px rgba(0, 0, 0, 0.4);
}

.theme-glass-toggle:active .tgt-knob {
  transform: translateY(-50%) scale(0.94);
}

/* Icons inside Knob */
.tgt-icon-sun,
.tgt-icon-moon {
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.95));
  transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.34, 1.4, 0.64, 1);
}

/* In Light mode: Moon is visible on left, Sun is hidden */
.tgt-icon-moon {
  display: flex;
}

.tgt-icon-sun {
  display: none;
}

/* Label text inside track (In Light mode: "Light" on the right) */
.tgt-label {
  font-family: var(--font-sans, system-ui, sans-serif);
  font-size: 13.5px;
  font-weight: 500;
  color: #ffffff;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  letter-spacing: -0.15px;
  position: absolute;
  right: 18px;
  left: auto;
  transition: all 0.32s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
  line-height: 1;
}

/* ==========================================================================
   DARK MODE STATE (Exact Image 1 Reference)
   ========================================================================== */
[data-theme="dark"] .tgt-track {
  background: rgba(45, 48, 55, 0.88);
  border-color: rgba(255, 255, 255, 0.2);
  box-shadow:
    inset 0 1px 2px rgba(255, 255, 255, 0.16),
    inset 0 -1.5px 2px rgba(0, 0, 0, 0.4),
    0 4px 14px rgba(0, 0, 0, 0.4);
}

/* Knob moves to RIGHT, crystal glass bubble with bright white rim highlights */
[data-theme="dark"] .tgt-knob {
  left: calc(100% - 39px);
  background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.8) 0%, rgba(185, 195, 210, 0.45) 45%, rgba(110, 120, 135, 0.3) 100%);
  border-color: rgba(255, 255, 255, 0.7);
  box-shadow:
    inset 0 3px 2.5px rgba(255, 255, 255, 0.95),
    inset 0 -2.5px 3px rgba(0, 0, 0, 0.4),
    inset 2.5px 0 3px rgba(255, 255, 255, 0.65),
    0 8px 22px rgba(0, 0, 0, 0.45),
    0 0 16px rgba(255, 255, 255, 0.2);
}

[data-theme="dark"] .tgt-icon-moon {
  display: none;
}

[data-theme="dark"] .tgt-icon-sun {
  display: flex;
}

/* Label moves to LEFT saying "Dark" */
[data-theme="dark"] .tgt-label {
  right: auto;
  left: 18px;
  color: #ffffff;
}

/* Hero Banner */
.hero {
  background: linear-gradient(135deg, #09111e 0%, #0d1b33 45%, #102447 100%);
  color: #ffffff;
  padding: 38px 24px 84px;
  position: relative;
  overflow: hidden;
  border-bottom: 2px solid rgba(217, 119, 6, 0.35);
}

.hero::before {
  content: '';
  position: absolute;
  top: -20%;
  right: 5%;
  width: 480px;
  height: 480px;
  background: radial-gradient(circle, rgba(37, 99, 235, 0.18) 0%, transparent 70%);
  pointer-events: none;
}

.hero-inner {
  max-width: 1320px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 28px;
  flex-wrap: wrap;
  position: relative;
  z-index: 1;
}

.hero-brand-meta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #f59e0b;
  margin-bottom: 10px;
}

.hero-brand-meta .shield-icon {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
}

.hero-title {
  font-size: 38px;
  font-weight: 800;
  line-height: 1.15;
  letter-spacing: -0.025em;
  color: #f8fafc;
  margin-bottom: 8px;
}

.hero-title span {
  background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero-subtitle {
  color: #94a3b8;
  font-size: 14px;
  font-weight: 500;
  max-width: 600px;
}


.score-badge-status {
  display: inline-block;
  padding: 3px 10px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  background: rgba(239, 68, 68, 0.2);
  color: #f87171;
  border: 1px solid rgba(239, 68, 68, 0.4);
}

.score-badge-status.optimal {
  background: rgba(16, 185, 129, 0.2);
  color: #34d399;
  border-color: rgba(16, 185, 129, 0.4);
}

.score-badge-status.warning {
  background: rgba(245, 158, 11, 0.2);
  color: #fbbf24;
  border-color: rgba(245, 158, 11, 0.4);
}

/* ==========================================================================
   DYNAMIC MONTH PILLS BAR (JAN -> DEC)
   ========================================================================== */
.month-pills-bar {
  max-width: 1320px;
  margin: 18px auto 0;
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 10px;
  overflow-x: auto;
  scrollbar-width: none;
}
.month-pills-bar::-webkit-scrollbar { display: none; }

/* 3D Satin Silver Pill Button (Exact Reference Design) */
.m-pill {
  flex: 1;
  min-width: 64px;
  height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.1px;
  font-family: var(--font-sans, system-ui, -apple-system, sans-serif);
  border-radius: 9999px;
  background: rgba(255, 255, 255, 0.68);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(205, 212, 224, 0.75);
  color: var(--muted, #64748b);
  cursor: pointer;
  user-select: none;
  transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow:
    inset 0 1px 1px rgba(255, 255, 255, 0.9),
    0 2px 5px rgba(0, 0, 0, 0.04);
}

.m-pill:hover {
  color: #111827;
  background: rgba(255, 255, 255, 0.95);
  border-color: rgba(160, 170, 185, 0.85);
  transform: translateY(-1.5px);
  box-shadow:
    inset 0 1.5px 1.5px rgba(255, 255, 255, 1),
    0 4px 12px rgba(0, 0, 0, 0.08);
}

/* Active Selected Month: Exact 3D Beveled Satin Pill from Reference Image */
.m-pill.active {
  background: linear-gradient(180deg, #f8f9fa 0%, #e6e8ec 40%, #d4d7dd 85%, #c8ccd4 100%);
  border: 1px solid rgba(145, 153, 168, 0.85);
  color: #111827;
  font-weight: 700;
  box-shadow:
    inset 0 2px 2px rgba(255, 255, 255, 1),
    inset 0 -2px 2.5px rgba(0, 0, 0, 0.15),
    inset 0 0 0 1px rgba(255, 255, 255, 0.4),
    0 4px 14px rgba(0, 0, 0, 0.12);
  transform: translateY(-0.5px);
}

.m-pill:active {
  transform: translateY(0.5px) scale(0.98);
}

/* Dark Mode Adaptation */
[data-theme="dark"] .m-pill {
  background: rgba(30, 41, 59, 0.55);
  border-color: rgba(255, 255, 255, 0.14);
  color: #94a3b8;
  box-shadow:
    inset 0 1px 1px rgba(255, 255, 255, 0.12),
    0 2px 6px rgba(0, 0, 0, 0.25);
}

[data-theme="dark"] .m-pill:hover {
  background: rgba(51, 65, 85, 0.7);
  border-color: rgba(255, 255, 255, 0.25);
  color: #f1f5f9;
}

[data-theme="dark"] .m-pill.active {
  background: linear-gradient(180deg, #475569 0%, #334155 45%, #1e293b 100%);
  border: 1px solid rgba(255, 255, 255, 0.32);
  color: #ffffff;
  font-weight: 700;
  box-shadow:
    inset 0 2px 2px rgba(255, 255, 255, 0.35),
    inset 0 -2px 2.5px rgba(0, 0, 0, 0.4),
    0 6px 18px rgba(0, 0, 0, 0.45);
}

/* ==========================================================================
   KEY SUMMARY TILES (HERO OVERLAP)
   ========================================================================== */
.stats-container {
  max-width: 1320px;
  margin: -50px auto 0;
  padding: 0 24px;
  position: relative;
  z-index: 4;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 16px;
}

.st {
  background: #ffffff !important;
  border-radius: 26px !important;
  padding: 22px 24px;
  border: 1px solid #e2e8f0 !important;
  box-shadow: 
    0 10px 30px -4px rgba(15, 23, 42, 0.05),
    0 2px 8px -2px rgba(15, 23, 42, 0.02) !important;
  cursor: pointer;
  position: relative;
  overflow: hidden !important;
  transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
}

.st > * {
  position: relative;
  z-index: 2;
}

.st::before {
  content: '';
  position: absolute;
  top: 0;
  left: 24px;
  right: 24px;
  height: 3px;
  border-radius: 9999px;
  background: linear-gradient(90deg, var(--brand), #60a5fa);
  opacity: 0.9;
  z-index: 3;
}

.st:hover {
  transform: translateY(-3px) !important;
  border-color: #cbd5e1 !important;
  box-shadow: 
    0 16px 36px -4px rgba(15, 23, 42, 0.08),

  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 8px;
  cursor: pointer;
  width: 100%;
  border: 1px solid var(--line-soft);
  transition: transform 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
}

.sla-radial-card:hover {
  background: var(--accent-soft);
  border-color: var(--accent);
}

.sla-radial-meter {
  position: relative;
  width: 64px;
  height: 64px;
}

.sla-radial-svg {
  transform: rotate(-90deg);
  width: 100%;
  height: 100%;
}

.sla-radial-val {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

.sla-radial-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
}

.sla-radial-tgt {
  font-size: 10.5px;
  color: var(--muted);
}

.tiles {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.tile {
  background: var(--bg);
  border-radius: 6px;
  padding: 12px 14px;
  min-width: 0;
  box-shadow: none;
}

.tile .t {
  font-size: 12px;
  color: var(--muted);
}

.tile .v {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -.02em;
  line-height: 1.25;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}

.tile .d {
  font-size: 12px;
  color: var(--muted);
}

.bad { color: var(--r); }
.good { color: var(--g); }

/* ============================================================
   LISTS & CHANGES
   ============================================================ */
.lists {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.li {
  list-style: none;
  margin: 10px 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
}

.li li {
  border-top: 1px solid var(--line-soft);
}

.li li:first-child {
  border-top: 0;
}

.li button {
  width: 100%;
  text-align: left;
  border: 0;
  background: none;
  padding: 9px 2px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: baseline;
  border-radius: 6px;
  transition: background-color 0.12s ease;
}

.li button:hover {
  background: var(--bg);
}

.li .nm {
  font-weight: 500;
  min-width: 0;
}

.li .meta {
  color: var(--muted);
  font-size: 12.5px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.empty {
  color: var(--muted);
  margin: 10px 0 0;
  font-size: 13px;
}

/* Zero Tolerance */
.zt {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 8px;
  margin-top: 12px;
}

.zt button {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 6px;
  padding: 8px 10px;
  text-align: left;
}

.zt button:hover {
  border-color: var(--accent);
}

.zt .nm {
  font-size: 13px;
  min-width: 0;
}

/* ============================================================
   ENHANCED PERFORMANCE AGAINST TARGET (SIMPLIFIED & VISUAL)
   ============================================================ */
.perf-card-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px 24px;
  margin-bottom: 12px;
}

.perf-summary-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.perf-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid transparent;
}

.perf-badge.g {
  background: #ecfdf5;
  color: #065f46;
  border-color: #a7f3d0;
}

.perf-badge.a {
  background: #fffbeb;
  color: #92400e;
  border-color: #fde68a;
}

.perf-badge.r {
  background: #fef2f2;
  color: #991b1b;
  border-color: #fecaca;
}

.perf-badge .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  display: inline-block;
}

.perf-badge.g .dot { background: #10b981; }
.perf-badge.a .dot { background: #f59e0b; }
.perf-badge.r .dot { background: #ef4444; }

.perf-dist-bar {
  display: flex;
  height: 5px;
  width: 100%;
  border-radius: 999px;
  overflow: hidden;
  background: #f1f5f9;
  margin-bottom: 22px;
}

.perf-dist-seg {
  height: 100%;
  transition: width 0.3s ease;
}

.perf-dist-seg.g { background: #10b981; }
.perf-dist-seg.a { background: #f59e0b; }
.perf-dist-seg.r { background: #ef4444; }

.perf-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 22px;
}

.perf-domain {
  background: var(--surface, #ffffff);
  border: 1px solid var(--border, #e2e8f0);
  border-radius: 8px;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
}

.perf-domain-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 12px;
  margin-bottom: 6px;
  border-bottom: 1px solid var(--line-soft, #f1f5f9);
}

.perf-domain-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--navy, #0f172a);
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: -0.01em;
}

.perf-domain-badge {
  font-size: 11.5px;
  font-weight: 500;
  color: var(--muted, #64748b);
  background: var(--bg, #f8fafc);
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid var(--border, #e2e8f0);
}

.perf-domain-cols {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(110px, 1.2fr) 60px 84px;
  column-gap: 12px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--muted, #64748b);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 4px 8px 8px 8px;
}

.perf-row {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(110px, 1.2fr) 60px 84px;
  column-gap: 12px;
  align-items: center;
  padding: 9px 8px;
  border-radius: 6px;
  border: 0;
  background: none;
  width: 100%;
  cursor: pointer;
  text-align: left;
  transition: background-color 0.12s ease;
  border-bottom: 1px solid var(--line-soft, #f8fafc);
}

.perf-row:last-child {
  border-bottom: 0;
}

.perf-row:hover {
  background: var(--accent-soft, #f0fdf4);
}

.perf-metric-name {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.perf-metric-name b {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink, #1e293b);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.perf-metric-name small {
  font-size: 11.5px;
  color: var(--muted, #64748b);
  margin-top: 1px;
}

.perf-gauge {
  position: relative;
  height: 9px;
  background: #f1f5f9;
  border-radius: 999px;
  display: flex;
  align-items: center;
  overflow: visible;
}

[data-theme="dark"] .perf-gauge {
  background: rgba(255, 255, 255, 0.12);
}

.perf-gauge-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 0.3s ease;
}

.perf-gauge-fill.g { background: linear-gradient(90deg, #10b981, #059669); }
.perf-gauge-fill.a { background: linear-gradient(90deg, #f59e0b, #d97706); }
.perf-gauge-fill.r { background: linear-gradient(90deg, #ef4444, #dc2626); }

.perf-gauge-target {
  position: absolute;
  top: -3px;
  bottom: -3px;
  width: 2px;
  background: #0f172a;
  border-radius: 1px;
  z-index: 2;
  margin-left: -1px;
}

[data-theme="dark"] .perf-gauge-target {
  background: #f8fafc;
}

.perf-val {
  font-size: 14px;
  font-weight: 700;
  color: var(--navy, #0f172a);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.perf-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  justify-content: center;
}

.perf-pill.g { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
.perf-pill.a { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
.perf-pill.r { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
.perf-pill.n { background: #f8fafc; color: #64748b; border: 1px solid #e2e8f0; }

.perf-pill .pdot {
  width: 5.5px;
  height: 5.5px;
  border-radius: 50%;
  display: inline-block;
}

.perf-pill.g .pdot { background: #10b981; }
.perf-pill.a .pdot { background: #f59e0b; }
.perf-pill.r .pdot { background: #ef4444; }

@media (max-width: 900px) {
  .perf-grid {
    grid-template-columns: minmax(0, 1fr);
  }
}



/* ============================================================
   COMMENTARY (MONTH IN REVIEW)
   ============================================================ */
.cm {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  margin-top: 12px;
}

.cm .cl {
  margin: 0 0 6px;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
}

.cmu {
  margin: 0;
  padding-left: 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.cmu li.empty {
  list-style: none;
  margin-left: -18px;
}

/* ============================================================
   SERVICE DELIVERED TILES
   ============================================================ */
.stats3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.stat {
  background: var(--surface-card, #ffffff);
  border: 1px solid rgba(0, 0, 0, 0.06);
  border-radius: 20px;
  padding: 22px 24px;

}

.stat::before {
  content: '';
  position: absolute;

  right: 0;

  opacity: 0.9;
}

.stat:hover {

}

.stat .t {
  display: block;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;

}

.stat .v {
  display: block;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -0.025em;

  color: var(--tx-heading, #0f172a);
  margin-bottom: 6px;
}

.stat .d {
  font-style: normal;
  font-size: 12px;
  font-weight: 600;
  color: var(--tx-muted, #64748b);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

[data-theme="dark"] .stat {
  background: linear-gradient(145deg, #151a24 0%, #0d1117 100%) !important;
  border: 1px solid rgba(255, 255, 255, 0.08) !important;

[data-theme="dark"] .stat:hover {
  transform: translateY(-3px);

}

[data-theme="dark"] .stat .t {
  color: #94a3b8 !important;
}

[data-theme="dark"] .stat .v {
  color: #ffffff !important;
}

[data-theme="dark"] .stat .d {
  color: #94a3b8 !important;
}

}

.sc tr.m {

.sc tr.m:hover td.l {

.sc .meta {

.cell {

.legend2 {

.legend2 span {

/* ============================================================
   DRAWER
   ============================================================ */
.scrim {
  position: fixed;
  inset: 0;

  z-index: 20;
}

/* ==========================================================================
   ULTRA-RICH EXECUTIVE TELEMETRY DRAWER (MATCHING REFERENCE HIGH DENSITY)
   ========================================================================== */

.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(720px, 100vw);
  background: rgba(10, 15, 28, 0.94);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-left: 1px solid rgba(255, 255, 255, 0.08);
  z-index: 999;
  display: flex;
  flex-direction: column;
  box-shadow: -24px 0 60px rgba(0, 0, 0, 0.65), inset 1px 0 0 rgba(255, 255, 255, 0.05);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  color: #f1f5f9;
}

[data-theme="light"] .drawer {
  background: rgba(248, 250, 252, 0.96);
  border-left-color: rgba(203, 213, 225, 0.8);
  box-shadow: -16px 0 45px rgba(15, 23, 42, 0.2);
  color: #0f172a;
}

.drawer .dh {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 18px 24px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(15, 23, 42, 0.65);
  flex-shrink: 0;
}

[data-theme="light"] .drawer .dh {
  background: rgba(255, 255, 255, 0.85);
  border-bottom-color: rgba(226, 232, 240, 0.9);
}

.drawer-dh-left {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.drawer-category-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #38bdf8;
}

.drawer-category-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #38bdf8;
  flex-shrink: 0;
  box-shadow: 0 0 10px #38bdf8;
}

.drawer h3 {
  margin: 0;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -0.025em;
  color: #f8fafc;
  line-height: 1.25;
}

[data-theme="light"] .drawer h3 {
  color: #0f172a;
}

.drawer .x {
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.05);

    0 6px 18px -2px rgba(168, 85, 247, 0.25),
    0 3px 8px rgba(0, 0, 0, 0.6);
}

.sc-controls-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.sc-search-wrap {
  position: relative;
  flex: 1;
  min-width: 260px;
  max-width: 440px;
}

.sc-search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}

.sc-search-wrap input {
  width: 100%;
  padding: 9px 12px 9px 36px;
  background: var(--card);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm, 6px);
  font-size: 13px;
  font-family: var(--font-sans);
  color: var(--ink);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.sc-search-wrap input:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
}

.sc-filter-tabs {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

/* Translucent Glass Pill Buttons (Exact Reference Design) */
.sc-filter-tab {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 7px 18px;
  border-radius: 9999px;
  font-size: 12.5px;
  font-weight: 600;
  font-family: var(--font-sans);
  cursor: pointer;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(203, 213, 225, 0.8);
  color: var(--muted);
  box-shadow:
    inset 0 1px 1px rgba(255, 255, 255, 0.9),
    0 2px 5px rgba(0, 0, 0, 0.04);
  transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  user-select: none;
}

.sc-filter-tab:hover {
  color: #065f46;
  background: rgba(236, 253, 245, 0.6);
  border-color: rgba(167, 243, 208, 0.9);
  transform: translateY(-1px);
  box-shadow:
    inset 0 1px 1px rgba(255, 255, 255, 1),
    0 4px 10px rgba(16, 185, 129, 0.1);
}

/* Active State: Translucent Pale-Mint Glass Pill Button with Inner Bevel */
.sc-filter-tab.active {
  background: linear-gradient(180deg, #ecfdf5 0%, #d1fae5 45%, #bbf7d0 85%, #a7f3d0 100%);
  border: 1px solid rgba(74, 222, 128, 0.65);
  color: #064e3b;
  font-weight: 700;
  box-shadow:
    inset 0 1.5px 1.5px rgba(255, 255, 255, 0.95),
    inset 0 -1.5px 2px rgba(5, 150, 105, 0.16),
    0 4px 14px rgba(16, 185, 129, 0.22),
    0 1px 3px rgba(16, 185, 129, 0.15);
  transform: translateY(-0.5px);
}

.sc-filter-tab:active {
  transform: translateY(0.5px) scale(0.98);
}

/* Dark Mode Adaptation */
[data-theme="dark"] .sc-filter-tab {
  background: rgba(30, 41, 59, 0.6);
  border-color: rgba(255, 255, 255, 0.14);
  color: #94a3b8;
  box-shadow:
    inset 0 1px 1px rgba(255, 255, 255, 0.12),
    0 2px 6px rgba(0, 0, 0, 0.25);
}

[data-theme="dark"] .sc-filter-tab:hover {
  background: rgba(6, 78, 59, 0.35);
  border-color: rgba(52, 211, 153, 0.4);
  color: #6ee7b7;
}

[data-theme="dark"] .sc-filter-tab.active {
  background: linear-gradient(180deg, rgba(52, 211, 153, 0.32) 0%, rgba(16, 185, 129, 0.22) 50%, rgba(5, 150, 105, 0.18) 100%);
  border: 1px solid rgba(52, 211, 153, 0.55);
  color: #6ee7b7;
  font-weight: 700;
  box-shadow:
    inset 0 1.5px 1.5px rgba(255, 255, 255, 0.25),
    inset 0 -1.5px 2px rgba(0, 0, 0, 0.3),
    0 4px 16px rgba(16, 185, 129, 0.28);
}

/* Headings row */
.sc-table-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 16px 4px 16px;
  font-size: 11px;
  font-weight: 700;
  font-family: var(--font-sans);
  color: var(--muted);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.sc-th-left {
  display: flex;
  align-items: center;
  gap: 16px;
  flex: 1;
}

.sc-th-rank { width: 36px; text-align: center; }
.sc-th-metric { flex: 1; }

.sc-th-right {
  display: flex;
  align-items: center;
  gap: 24px;
}

.sc-th-tele { text-align: center; }
.sc-th-score { width: 76px; text-align: center; }
.sc-th-action { width: 20px; text-align: center; }

/* The Scorecard Card Row */
.sc-rows-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.sc-card-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--card, #ffffff);
  color: var(--ink);
  border: 1px solid rgba(0, 0, 0, 0.06);
  border-radius: 16px;
  padding: 14px 20px;
  transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease;
  cursor: pointer;
  box-shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.04), inset 0 1px 1px rgba(255, 255, 255, 0.8);
}

.sc-card-row:hover {
  transform: translateY(-2px);
  background: #ffffff;
  border-color: rgba(37, 99, 235, 0.25);
  box-shadow: 0 12px 28px -4px rgba(15, 23, 42, 0.08);
}

[data-theme="dark"] .sc-card-row {
  background: linear-gradient(145deg, #131722 0%, #0d1017 100%);
  border: 1px solid rgba(255, 255, 255, 0.07);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.06);
}

[data-theme="dark"] .sc-card-row:hover {
  background: linear-gradient(145deg, #161c28 0%, #0f131c 100%);
  border-color: rgba(52, 211, 153, 0.35);
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.6), 0 0 16px rgba(16, 185, 129, 0.08);
  transform: translateY(-2px);
}

.sc-row-left {
  display: flex;
  align-items: center;
  gap: 16px;
  flex: 1;
  min-width: 0;
}

.sc-rank-col {
  width: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.sc-rank-num {
  font-size: 14px;
  font-weight: 700;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  text-align: center;
}

.sc-metric-col {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.sc-metric-name {
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--ink);
  font-family: var(--font-sans);
}

.sc-metric-sub {
  font-size: 11.5px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-family: var(--font-sans);
}

.sc-weight-tag {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.4px;
  padding: 1px 6px;
  border-radius: 4px;
  background: var(--bg-subtle, #f1f5f9);
  color: var(--muted);
  border: 1px solid var(--line-soft);
}

.sc-weight-tag.critical { background: #fee2e2; color: #dc2626; border-color: #fecaca; }
.sc-weight-tag.high     { background: #fef3c7; color: #d97706; border-color: #fde68a; }

[data-theme="dark"] .sc-weight-tag.critical { background: rgba(239, 68, 68, 0.2); color: #f87171; border-color: rgba(239, 68, 68, 0.4); }
[data-theme="dark"] .sc-weight-tag.high     { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border-color: rgba(245, 158, 11, 0.4); }

.sc-sep { color: var(--line, #cbd5e1); }

.sc-row-right {
  display: flex;
  align-items: center;
  gap: 24px;
}

/* Generous, relaxed distance between months */
.sc-tele-wrap {
  display: flex;
  align-items: center;
  gap: clamp(16px, 2.5vw, 32px);
  justify-content: flex-end;
}

.sc-tele-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 54px;
}

.sc-tele-lbl {
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.sc-tele-val {
  font-size: 12.5px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}

.sc-tele-item.cur .sc-tele-val {
  font-size: 13px;
  font-weight: 800;
}

.sc-tele-val.g { color: var(--g, #059669); }
.sc-tele-val.a { color: var(--a, #d97706); }
.sc-tele-val.r { color: var(--r, #dc2626); }

[data-theme="dark"] .sc-tele-val.g { color: #34d399; }
[data-theme="dark"] .sc-tele-val.a { color: #fbbf24; }
[data-theme="dark"] .sc-tele-val.r { color: #f87171; }

.sc-score-col {
  width: 76px;
  display: flex;
  justify-content: center;
}

/* Native client dashboard score pill styling */
.sc-score-pill {
  min-width: 70px;
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 12.5px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  text-align: center;
}

.sc-score-pill.g { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
.sc-score-pill.a { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
.sc-score-pill.r { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
.sc-score-pill.n { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }

[data-theme="dark"] .sc-score-pill.g { background: rgba(16, 185, 129, 0.16); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.35); }
[data-theme="dark"] .sc-score-pill.a { background: rgba(245, 158, 11, 0.16); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.35); }
[data-theme="dark"] .sc-score-pill.r { background: rgba(239, 68, 68, 0.16); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.35); }
[data-theme="dark"] .sc-score-pill.n { background: rgba(148, 163, 184, 0.12); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.25); }

.sc-action-col {
  width: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sc-chevron {
  font-size: 18px;
  font-weight: 700;
  color: var(--muted);
  transition: transform 0.15s ease, color 0.15s ease;
}

.sc-card-row:hover .sc-chevron {
  transform: translateX(3px);
  color: var(--ink);
}

@media (max-width: 900px) {
  .sc-tele-wrap { display: none; }
  .sc-th-tele { display: none; }
}

/* ==========================================================================
   PRINT / PDF EXPORT STYLING FOR SCORECARD
   ========================================================================== */
@media print {
  .top-strip, .hero, .stats-container, .month-pills-bar, .sticky-tabs, .sc-controls-bar, .sc-download-btn, #layer {
    display: none !important;
  }
  body, .main-content-view, .scorecard-container {
    background: #ffffff !important;
    color: #0f172a !important;
    padding: 0 !important;
    margin: 0 !important;
    max-width: 100% !important;
  }
  .sc-header-bar {
    box-shadow: none !important;
    border-bottom: 2px solid #0f172a !important;
    padding: 12px 0 !important;
  }
  .sc-card-row {
    break-inside: avoid;
    border: 1px solid #e2e8f0 !important;
    background: #ffffff !important;
    box-shadow: none !important;
    margin-bottom: 6px !important;
  }
  .sc-metric-name {
    color: #0f172a !important;
  }
}

/* ========================================================================= */
/* GLASSMORPHIC PIE / DONUT SEGMENT DETAIL CARD (REFERENCE INSPIRED)         */
/* ========================================================================= */

/* Backdrop for centered detail card */
.glass-detail-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.22);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  z-index: 10040;
  opacity: 0;
  transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: auto;
}

.glass-detail-backdrop.is-visible {
  opacity: 1;
}

.glass-detail-backdrop.is-closing {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}

[data-theme="dark"] .glass-detail-backdrop {
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

.glass-segment-detail-card {
  position: fixed;
  z-index: 10050;
  width: min(580px, calc(100vw - 32px));
  max-width: 580px;
  max-height: min(85vh, 680px);
  top: 50%;
  left: 50%;
  background: rgba(255, 255, 255, 0.78) !important;
  backdrop-filter: blur(20px) saturate(190%) !important;
  -webkit-backdrop-filter: blur(20px) saturate(190%) !important;
  border-radius: 20px !important;
  border: 1px solid rgba(255, 255, 255, 0.75) !important;
  box-shadow: 
    0 20px 50px rgba(15, 23, 42, 0.18),
    0 4px 12px rgba(15, 23, 42, 0.06),
    inset 0 1px 2px rgba(255, 255, 255, 0.95) !important;
  padding: 18px 22px 16px 22px;
  box-sizing: border-box;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  pointer-events: auto;
  opacity: 0;
  transform: translate(-50%, -50%) scale(0.96);
  transition: opacity 0.24s cubic-bezier(0.16, 1, 0.3, 1), transform 0.24s cubic-bezier(0.16, 1, 0.3, 1), width 0.32s cubic-bezier(0.16, 1, 0.3, 1), max-width 0.32s cubic-bezier(0.16, 1, 0.3, 1), max-height 0.32s cubic-bezier(0.16, 1, 0.3, 1);
}

.glass-segment-detail-card.is-visible {
  opacity: 1 !important;
  transform: translate(-50%, -50%) scale(1) !important;
}

.glass-segment-detail-card.is-expanded {
  width: min(740px, calc(100vw - 32px)) !important;
  max-width: 740px !important;
  max-height: min(92vh, 880px) !important;
}

.glass-segment-detail-card.is-closing {
  opacity: 0 !important;
  transform: translate(-50%, -50%) scale(0.96) !important;
  pointer-events: none !important;
  transition: opacity 0.18s cubic-bezier(0.16, 1, 0.3, 1), transform 0.18s cubic-bezier(0.16, 1, 0.3, 1) !important;
}

[data-theme="dark"] .glass-segment-detail-card {
  background: rgba(15, 23, 42, 0.78) !important;
  backdrop-filter: blur(22px) saturate(190%) !important;
  -webkit-backdrop-filter: blur(22px) saturate(190%) !important;
  border: 1px solid rgba(255, 255, 255, 0.16) !important;
  box-shadow: 
    0 16px 45px rgba(0, 0, 0, 0.45),
    inset 0 1px 1px rgba(255, 255, 255, 0.18) !important;
}

@media (prefers-reduced-motion: reduce) {
  .glass-segment-detail-card {
    transition: none !important;
    transform: none !important;
    animation: none !important;
  }
}

/* Header */
.glass-detail-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(226, 232, 240, 0.6);
}

[data-theme="dark"] .glass-detail-head {
  border-bottom-color: rgba(51, 65, 85, 0.6);
}

.glass-detail-head-left {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.glass-detail-badge-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.glass-category-pill {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 0.05em;
  padding: 2px 8px;
  border-radius: 999px;
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.glass-category-pill.red {
  background: #fee2e2;
  color: #b91c1c;
  border: 1px solid #fca5a5;
}
.glass-category-pill.amber {
  background: #fef9c3;
  color: #a16207;
  border: 1px solid #fde047;
}
.glass-category-pill.green {
  background: #dcfce7;
  color: #15803d;
  border: 1px solid #86efac;
}
.glass-category-pill.trend,
.glass-category-pill.blue {
  background: #eff6ff;
  color: #2563eb;
  border: 1px solid #bfdbfe;
}

.glass-source-pill {
  font-size: 10px;
  color: #64748b;
  font-weight: 600;
}

.glass-detail-title {
  margin: 0;
  font-size: 16.5px;
  font-weight: 800;
  letter-spacing: -0.015em;
  color: #0f172a;
}

[data-theme="dark"] .glass-detail-title {
  color: #f8fafc;
}

.glass-detail-subtitle {
  margin: 0;
  font-size: 11.5px;
  color: #64748b;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 6px;
}

.glass-detail-meta-total {
  font-weight: 750;
  color: #0f172a;
  background: rgba(226, 232, 240, 0.7);
  padding: 1px 7px;
  border-radius: 5px;
  font-size: 11px;
}

[data-theme="dark"] .glass-detail-meta-total {
  color: #f1f5f9;
  background: rgba(51, 65, 85, 0.7);
}

.glass-detail-close-btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px solid rgba(226, 232, 240, 0.8);
  background: rgba(255, 255, 255, 0.9);
  color: #64748b;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  font-size: 16px;
  line-height: 1;
}

.glass-detail-close-btn:hover {
  background: #0f172a;
  color: #ffffff;
  border-color: #0f172a;
  transform: scale(1.05);
}

[data-theme="dark"] .glass-detail-close-btn {
  background: rgba(30, 41, 59, 0.9);
  border-color: rgba(51, 65, 85, 0.8);
  color: #cbd5e1;
}

/* Record List with Sleek Scroll */
.glass-record-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-bottom: 12px;
  max-height: min(48vh, 320px);
  overflow-y: auto;
  padding-right: 4px;
  transition: max-height 0.32s cubic-bezier(0.16, 1, 0.3, 1);
}

.glass-segment-detail-card.is-expanded .glass-record-list {
  max-height: min(76vh, 700px) !important;
}

.glass-record-list::-webkit-scrollbar {
  width: 4px;
}
.glass-record-list::-webkit-scrollbar-thumb {
  background: rgba(148, 163, 184, 0.5);
  border-radius: 4px;
}

/* Individual Record Pill - matching reference card's sleek input capsule design */
.glass-record-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: rgba(255, 255, 255, 0.65);
  border: 1px solid rgba(255, 255, 255, 0.8);
  border-radius: 12px;
  padding: 8px 14px;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
}

[data-theme="dark"] .glass-record-item {
  background: rgba(30, 41, 59, 0.6);
  border-color: rgba(255, 255, 255, 0.08);
}

.glass-record-item:hover {
  background: #ffffff;
  border-color: #cbd5e1;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
}

[data-theme="dark"] .glass-record-item:hover {
  background: rgba(30, 41, 59, 0.9);
  border-color: rgba(148, 163, 184, 0.3);
}

.glass-record-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  flex: 1;
}

.glass-record-idx {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #0f172a;
  color: #ffffff;
  font-size: 11px;
  font-weight: 750;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

[data-theme="dark"] .glass-record-idx {
  background: #38bdf8;
  color: #0f172a;
}

.glass-record-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.glass-record-name {
  font-size: 13.5px;
  font-weight: 700;
  color: #0f172a;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

[data-theme="dark"] .glass-record-name {
  color: #f1f5f9;
}

.glass-record-tags {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.glass-record-tag {
  font-size: 10.5px;
  color: #64748b;
  font-weight: 500;
}

.glass-record-tag.system {
  color: #475569;
  font-weight: 600;
}

.glass-record-tag.target {
  color: #059669;
  background: #ecfdf5;
  padding: 1px 6px;

      .replace(/</g, '&lt;')

  function applyServerData(json) {
    if (!json) return;
    if (json.year) state.year = parseInt(json.year, 10);
    if (json.month) {
      const parts = json.month.split('-');
      if (parts.length === 2) {
        state.m = parseInt(parts[1], 10);
      }
    }

    const allMonths = json.allMonthsData || {};
    const ytdData = json.ytd || {};
    const currentMonthData = json.monthData || {};

    const activeMonthNums = AVAIL.filter(i => {
      const mKey = `${state.year}-${String(i).padStart(2, '0')}`;
      const mObj = allMonths[mKey];
      return mObj && mObj.metrics && Object.values(mObj.metrics).some(m => m && m.computed !== null && m.computed !== undefined);
    });
    CHART_MONTHS = activeMonthNums.length > 0 ? activeMonthNums : AVAIL;

    AVAIL.forEach(i => {
      const mKey = `${state.year}-${String(i).padStart(2, '0')}`;
      const mObj = allMonths[mKey];
      if (mObj && mObj.rag) {
        const r = (mObj.rag || '').toLowerCase();
        DATA.ov.overall[i] = r === 'green' ? 'Green' : (r === 'amber' ? 'Amber' : (r === 'red' ? 'Red' : null));
        let breaches = 0;
        if (mObj.metrics) {
          const vetoList = ['critical_patches_outstanding', 'ransomware_detections', 'p1_security_incidents', 'critical_vulns_open', 'open_gt30_sla', 'open_gt60_sla', 'open_gt90_sla', 'policy_exceptions_open'];
          vetoList.forEach(vid => {
            if (mObj.metrics[vid] && mObj.metrics[vid].rag === 'red') breaches++;
          });
        }
        DATA.ov.breaches[i] = breaches;
        DATA.ov.score[i] = (typeof mObj.healthScore === 'number') ? mObj.healthScore : null;
      } else {
        DATA.ov.overall[i] = null;
        DATA.ov.breaches[i] = 0;
        DATA.ov.score[i] = null;
      }
    });

    DATA.sections.forEach(s => {
      s.rows.forEach(r => {
        const mapping = ROW_MAP[r.r];
        if (!mapping) {
          AVAIL.forEach(i => {
            r.v[i] = null;
            r.rag[i] = null;
          });
          r.ytd = null;
          r.ytdrag = null;
          r.ytdMethod = null;
          return;
        }

        AVAIL.forEach(i => {
          const mKey = `${state.year}-${String(i).padStart(2, '0')}`;
          const isSelected = (mKey === json.month);

          if (mapping.id) {
            const mId = mapping.id;
            let val = null;
            let ragStr = null;

            if (isSelected && currentMonthData[mId]) {
              val = currentMonthData[mId].computed;
              ragStr = currentMonthData[mId].rag;
            } else if (allMonths[mKey] && allMonths[mKey].metrics && allMonths[mKey].metrics[mId]) {
              val = allMonths[mKey].metrics[mId].computed;
              ragStr = allMonths[mKey].metrics[mId].rag;
            }

            if (typeof val === 'number') {
              r.v[i] = isPct(r) ? val / 100 : val;
            } else if (state.year === 2026 && r._origV && typeof r._origV[i] === 'number') {
              const rawFallback = r._origV[i];
              r.v[i] = (isPct(r) && rawFallback > 2.0) ? rawFallback / 100 : rawFallback;
            } else {
              r.v[i] = null;
            }
            r.rag[i] = ragStr ? (ragStr.toLowerCase() === 'green' ? 1 : (ragStr.toLowerCase() === 'amber' ? 0 : (ragStr.toLowerCase() === 'red' ? -1 : null))) : null;
          } else if (mapping.helper) {
            const mSource = isSelected ? currentMonthData : (allMonths[mKey] && allMonths[mKey].metrics ? allMonths[mKey].metrics : null);
            const hVal = getHelperValue(mapping.helper, mSource);
            if (hVal !== null && typeof hVal === 'number') {
              r.v[i] = hVal;
            } else if (state.year === 2026 && r._origV && typeof r._origV[i] === 'number') {
              r.v[i] = r._origV[i];
            } else {
              r.v[i] = null;
            }
            r.rag[i] = null;
          }
        });

        if (mapping.id) {
          const mId = mapping.id;
          const yObj = ytdData[mId];
          if (yObj && typeof yObj.computed === 'number') {
            r.ytd = isPct(r) ? yObj.computed / 100 : yObj.computed;
            r.ytdrag = yObj.rag ? (yObj.rag.toLowerCase() === 'green' ? 1 : (yObj.rag.toLowerCase() === 'amber' ? 0 : (yObj.rag.toLowerCase() === 'red' ? -1 : null))) : null;
            r.ytdMethod = yObj.method || null;
          } else {
            r.ytd = null;
            r.ytdrag = null;
            r.ytdMethod = null;
          }
        }
      });
    });

    Object.keys(COMMENT).forEach(k => delete COMMENT[k]);
    if (json.narrative && typeof json.narrative === 'object') {
      const narr = json.narrative;
      const risks = narr.topRisks ? [narr.topRisks] : [];
      const imps = narr.improvements ? [narr.improvements] : [];
      const acts = narr.plannedActions ? [narr.plannedActions] : [];
      if (risks.length || imps.length || acts.length) {
        COMMENT[state.m] = {
          risks,
          improvements: imps,
          actions: acts
        };
      }
    }

  function updateTelemetryBadge(isLive) {
    const badge = document.querySelector('.telemetry-pulse-badge');
    if (!badge) return;
    if (isLive) {
      badge.innerHTML = '<span class="pulse-dot"></span><span>LIVE TELEMETRY VERIFIED</span>';
      badge.classList.remove('fallback-mode');
    } else {
      badge.innerHTML = '<span class="pulse-dot" style="background:#f59e0b;box-shadow:0 0 8px rgba(245,158,11,0.6)"></span><span style="color:#f59e0b;font-weight:600">OFFLINE / CACHED FALLBACK DATA</span>';
      badge.classList.add('fallback-mode');
    }
  }

  function extractToken() {
    try {
      const q = new URLSearchParams(window.location.search).get('token');
      if (q && q.trim()) return q.trim();
      const m = window.location.pathname.match(/\/client\/([a-zA-Z0-9_-]+)/);
      if (m && m[1] && m[1].trim()) return m[1].trim();
    } catch (e) {}
    return null;
  }

  async function fetchClientData(monthKey) {
    try {
      const token = extractToken();
      let url = '/api/public/client-data?month=' + encodeURIComponent(monthKey);
      if (token) url += '&token=' + encodeURIComponent(token);
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      if (!json || !json.success) throw new Error(json.error || 'Server error');
      state.data = json;

      if (json.clientName && json.clientName !== 'Brysa') {
        const topClientEl = document.getElementById('top-client-name');
        if (topClientEl) topClientEl.textContent = ' · Client: ' + json.clientName;
        const heroTitlePeriod = document.getElementById('hero-title-period');
        if (heroTitlePeriod) {
          heroTitlePeriod.innerHTML = MON[state.m] + ' ' + state.year + ' Executive Audit &middot; <span style="color:#38bdf8">' + json.clientName + '</span>';
        }
      }

      applyServerData(json);
      updateTelemetryBadge(true);
      render();
      if (currentDrawerId && document.getElementById('layer').querySelector('.drawer')) {
        openDrawer(currentDrawerId);
      }
    } catch (err) {
      console.warn('Note: using cached client figures:', err.message);
      updateTelemetryBadge(false);
      render();
      if (currentDrawerId && document.getElementById('layer').querySelector('.drawer')) {
        openDrawer(currentDrawerId);
      }
    }
  }

  const CHARTS = [];
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  /* formatting */
  const isPct = r => /%/.test(r.name);
  const unitOf = r => /\(hours\)/.test(r.name) ? ' h' : (/\(days\)|^Avg days/.test(r.name) ? ' d' : '');

  function fmt(r, v) {
    if (v === null || v === undefined || v === '') return '–';
    if (isPct(r)) {
      const p = v * 100;
      return (Math.abs(p % 1) < 1e-9 ? p.toFixed(0) : p.toFixed(1)) + '%';
    }
    const n = Number.isInteger(v) ? String(v) : v.toFixed(1);
    return n + unitOf(r);
  }

  function target(r) {
    if (!r.scored) return '';
    if (r.veto) return 'Zero tolerance';
    const t = fmt(r, r.target);
    return r.dir === 'Higher' ? '≥ ' + t : '≤ ' + t;
  }

  const cls = x => x === 1 ? 'g' : x === 0 ? 'a' : x === -1 ? 'r' : 'n';

  function label(r, x) {
    if (x === null || x === undefined) return '';
    if (r.veto) return x === 1 ? 'Clear' : 'Breach';
    return x === 1 ? 'On target' : x === 0 ? 'Near target' : 'Off target';
  }

  function pill(r, x) {
    if (x === null || x === undefined) return '';
    return '<span class="pill ' + cls(x) + '">' + label(r, x) + '</span>';
  }

  function delta(r, m) {
    const p = m - 1;
    let pv = (p >= 1) ? r.v[p] : null;
    let pLabel = (p >= 1) ? MON[p] : 'last month';

    if (p < 1 && state.data && state.data.prevData && ROW_MAP[r.r]?.id) {
      const prevComputed = state.data.prevData[ROW_MAP[r.r].id]?.computed;
      if (typeof prevComputed === 'number') {
        pv = isPct(r) ? prevComputed / 100 : prevComputed;
        pLabel = state.data.prevMonth ? 'Dec ' + (state.year - 1) : 'last month';
      }
    }

    const v = r.v[m];
    if (typeof v !== 'number' || typeof pv !== 'number') return '';
    const d = v - pv;
    if (Math.abs(d) < 1e-9) return '<span>No change vs ' + pLabel + '</span>';
    const up = d > 0, ad = Math.abs(d);
    let txt;
    if (isPct(r)) txt = (up ? '+' : '−') + (ad * 100).toFixed(1) + ' pts vs ' + pLabel;
    else if (unitOf(r)) txt = (up ? '+' : '−') + (Number.isInteger(ad) ? ad : ad.toFixed(1)) + unitOf(r) + ' vs ' + pLabel;
    else txt = (up ? '+' : '−') + (Number.isInteger(ad) ? ad : ad.toFixed(1)) + ' vs ' + pLabel;
    let c = '';
    if (r.dir === 'Higher') c = up ? 'good' : 'bad';
    else if (r.dir === 'Lower') c = up ? 'bad' : 'good';
    return '<span class="' + c + '">' + txt + '</span>';
  }

  function counts(m) {
    let g = 0, a = 0, rr = 0;
    scored.forEach(r => {
      const x = r.rag[m];
      if (x === 1) g++;
      else if (x === 0) a++;
      else if (x === -1) rr++;
    });
    return { g, a, r: rr, n: g + a + rr };
  }

  function spark(r, m) {
    if (!r || !r.v) {
      return '<div class="luminous-spark-empty"><span class="luminous-empty-badge">No data recorded</span></div>';
    }

    const months = CHART_MONTHS;
    const pts = months.map(i => ({ x: i, v: typeof r.v[i] === 'number' ? r.v[i] : null }));
    const validVals = pts.filter(p => p.v !== null).map(p => p.v);

    if (validVals.length === 0) {
      return '<div class="luminous-spark-empty">' +
        '<div class="luminous-empty-badge">' +
          '<span class="luminous-empty-dot"></span>' +
          '<span>No historical telemetry recorded</span>' +
        '</div>' +
      '</div>';
    }

    const minV = Math.min(...validVals, 0);
    const maxV = Math.max(...validVals, 1);
    const range = (maxV - minV) || 1;

    // ViewBox: 240 wide, 62 tall. Plot area: X from 12 to 228, baseY = 46, plotH = 36
    const plotW = 216;
    const plotH = 34;
    const startX = 12;
    const baseY = 46;

    const getX = mon => startX + ((mon - 1) / 11) * plotW;
    const getY = v => {
      if (v === null) return baseY;
      const norm = (v - minV) / range;
      return baseY - norm * plotH;
    };

    const coords = pts.map(p => ({
      x: getX(p.x),
      y: p.v !== null ? getY(p.v) : baseY,
      hasVal: p.v !== null,
      m: p.x,
      val: p.v
    }));

    // Multi-layered secondary background mountain ridge for rich depth
    const bgCoords = coords.map(c => ({
      x: c.x,
      y: baseY - ((baseY - c.y) * 0.72)
    }));

    function splinePath(points) {
      if (points.length < 2) return '';
      let d = 'M ' + points[0].x.toFixed(1) + ' ' + points[0].y.toFixed(1);
      for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[i === 0 ? 0 : i - 1];
        const p1 = points[i];
        const p2 = points[i + 1];
        const p3 = points[i + 2 < points.length ? i + 2 : i + 1];
        const cp1x = p1.x + (p2.x - p0.x) / 5;
        const cp1y = p1.y + (p2.y - p0.y) / 5;
        const cp2x = p2.x - (p3.x - p1.x) / 5;
        const cp2y = p2.y - (p3.y - p1.y) / 5;
        d += ' C ' + cp1x.toFixed(1) + ' ' + cp1y.toFixed(1) + ', ' + cp2x.toFixed(1) + ' ' + cp2y.toFixed(1) + ', ' + p2.x.toFixed(1) + ' ' + p2.y.toFixed(1);
      }
      return d;
    }

    const fgLineD = splinePath(coords);
    const fgAreaD = fgLineD + ' L ' + coords[coords.length - 1].x.toFixed(1) + ' ' + baseY + ' L ' + coords[0].x.toFixed(1) + ' ' + baseY + ' Z';

    const bgLineD = splinePath(bgCoords);
    const bgAreaD = bgLineD + ' L ' + bgCoords[bgCoords.length - 1].x.toFixed(1) + ' ' + baseY + ' L ' + bgCoords[0].x.toFixed(1) + ' ' + baseY + ' Z';

    // Color theme mapping matching user reference image (Amber/Orange flame glow by default)
    let colorKey = 'amber';
    if (r.scored && r.rag) {
      if (r.rag[m] === 1) colorKey = 'green';
      else if (r.rag[m] === -1) colorKey = 'red';
      else if (r.rag[m] === 0) colorKey = 'amber';
    } else if (r.name.toLowerCase().includes('patch') || r.name.toLowerCase().includes('device')) {
      colorKey = 'blue';
    }

    const colorPalettes = {
      amber: {
        neon: '#f97316',
        stroke: '#fb923c',
        fillStart: 'rgba(249, 115, 22, 0.48)',
        fillMid: 'rgba(249, 115, 22, 0.16)',
        bgFill: 'rgba(234, 88, 12, 0.12)',
        halo: 'rgba(251, 146, 60, 0.95)'
      },
      green: {
        neon: '#10b981',
        stroke: '#34d399',
        fillStart: 'rgba(16, 185, 129, 0.48)',
        fillMid: 'rgba(16, 185, 129, 0.16)',
        bgFill: 'rgba(5, 150, 105, 0.12)',
        halo: 'rgba(52, 211, 153, 0.95)'
      },
      red: {
        neon: '#ef4444',
        stroke: '#f87171',
        fillStart: 'rgba(239, 68, 68, 0.48)',
        fillMid: 'rgba(239, 68, 68, 0.16)',
        bgFill: 'rgba(220, 38, 38, 0.12)',
        halo: 'rgba(248, 113, 113, 0.95)'
      },
      blue: {
        neon: '#2563eb',
        stroke: '#60a5fa',
        fillStart: 'rgba(37, 99, 235, 0.48)',
        fillMid: 'rgba(37, 99, 235, 0.16)',
        bgFill: 'rgba(29, 78, 216, 0.12)',
        halo: 'rgba(96, 165, 250, 0.95)'
      }
    };

    const c = colorPalettes[colorKey] || colorPalettes.amber;
    const uid = 'r' + Math.abs(r.name.split('').reduce((a, b) => (a << 5) - a + b.charCodeAt(0), 0) % 99999);
    const curPt = coords[m - 1] || coords[0];

    // Minimalist month ticks & numbers matching reference image (01 02 03 ... 12)
    const ticks = coords.map((pt, idx) => {
      const isAct = (idx + 1 === m);
      const num = String(idx + 1).padStart(2, '0');
      return '<line x1="' + pt.x.toFixed(1) + '" y1="' + baseY + '" x2="' + pt.x.toFixed(1) + '" y2="' + (baseY + 3) + '" stroke="' + (isAct ? c.stroke : 'rgba(148, 163, 184, 0.22)') + '" stroke-width="' + (isAct ? '1.5' : '1') + '" />' +
        '<text x="' + pt.x.toFixed(1) + '" y="' + (baseY + 11) + '" text-anchor="middle" class="luminous-tick-txt' + (isAct ? ' active' : '') + '">' + num + '</text>';
    }).join('');

    return '<div class="luminous-ridge-wrap">' +
      '<svg viewBox="0 0 240 62" preserveAspectRatio="none" class="luminous-ridge-svg" aria-hidden="true">' +
        '<defs>' +
          '<linearGradient id="fg-' + uid + '" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0%" stop-color="' + c.stroke + '" stop-opacity="0.52" />' +
            '<stop offset="50%" stop-color="' + c.neon + '" stop-opacity="0.18" />' +
            '<stop offset="100%" stop-color="' + c.neon + '" stop-opacity="0.0" />' +
          '</linearGradient>' +
          '<linearGradient id="bg-' + uid + '" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0%" stop-color="' + c.neon + '" stop-opacity="0.25" />' +
            '<stop offset="100%" stop-color="' + c.neon + '" stop-opacity="0.0" />' +
          '</linearGradient>' +
          '<filter id="glow-' + uid + '" x="-20%" y="-20%" width="140%" height="140%">' +
            '<feGaussianBlur stdDeviation="2.2" result="blur" />' +
            '<feMerge>' +
              '<feMergeNode in="blur" />' +
              '<feMergeNode in="SourceGraphic" />' +
            '</feMerge>' +
          '</filter>' +
        '</defs>' +
        '<!-- Baseline Grid -->' +
        '<line x1="12" y1="' + baseY + '" x2="228" y2="' + baseY + '" stroke="rgba(148, 163, 184, 0.16)" stroke-width="1" />' +
        '<!-- Secondary Background Ridge Wave -->' +
        '<path d="' + bgAreaD + '" fill="url(#bg-' + uid + ')" />' +
        '<path d="' + bgLineD + '" fill="none" stroke="' + c.neon + '" stroke-opacity="0.32" stroke-width="1" />' +
        '<!-- Primary Foreground Ridge Wave -->' +
        '<path d="' + fgAreaD + '" fill="url(#fg-' + uid + ')" />' +
        '<!-- Glowing Neon Line Path -->' +
        '<path d="' + fgLineD + '" fill="none" stroke="' + c.stroke + '" stroke-width="1.8" filter="url(#glow-' + uid + ')" vector-effect="non-scaling-stroke" />' +
        '<!-- Timeline Ticks -->' +
        ticks +
        '<!-- Glowing Luminous Beacon Node on Active Month -->' +
        '<g class="luminous-beacon-group" transform="translate(' + curPt.x.toFixed(1) + ', ' + curPt.y.toFixed(1) + ')">' +
          '<line x1="0" y1="0" x2="0" y2="' + (baseY - curPt.y).toFixed(1) + '" stroke="' + c.stroke + '" stroke-opacity="0.4" stroke-dasharray="2,2" stroke-width="1" />' +
          '<circle cx="0" cy="0" r="5" fill="' + c.neon + '" opacity="0.45">' +
            '<animate attributeName="r" values="3.5;7.5;3.5" dur="2.4s" repeatCount="indefinite" />' +
            '<animate attributeName="opacity" values="0.55;0.12;0.55" dur="2.4s" repeatCount="indefinite" />' +
          '</circle>' +
          '<circle cx="0" cy="0" r="3.6" fill="' + c.stroke + '" opacity="0.9" />' +
          '<circle cx="0" cy="0" r="1.8" fill="#ffffff" />' +
        '</g>' +
      '</svg>' +
    '</div>';
  }

  // ==========================================================================
  // LUMINOUS MULTI-LAYER MOUNTAIN RIDGE TRAJECTORY CHART (REFERENCE SECTION 2)
  // Multi-layered undulating translucent mountain ridges with milestone drop needles
  // ==========================================================================
  function createLuminousMountainRidgeChart(opts) {
    const id = opts.id || ('mt_ridge_' + Math.floor(Math.random() * 100000));
    const width = opts.width || 760;
    const height = opts.height || 210;
    const points = opts.points || [];
    const activeMonth = opts.activeMonth || state.m;
    const yMin = typeof opts.yMin === 'number' ? opts.yMin : 0;
    const yMax = typeof opts.yMax === 'number' ? opts.yMax : 100;
    const yUnit = opts.yUnit !== undefined ? opts.yUnit : '%';
    const yTicks = opts.yTicks || [20, 40, 65, 95];
    const xLabels = opts.xLabels || CHART_MONTHS.map(i => MON[i]);
    const milestones = opts.milestones || [];
    const themeColor = opts.themeColor || 'amber';

    const palettes = {
      amber: {
        neon: '#f97316',
        stroke: '#fb923c',
        fgGradTop: 'rgba(249, 115, 22, 0.62)',
        fgGradBot: 'rgba(249, 115, 22, 0.0)',
        midFillTop: 'rgba(234, 88, 12, 0.35)',
        midFillBot: 'rgba(234, 88, 12, 0.0)',
        bgFillTop: 'rgba(194, 65, 12, 0.20)',
        bgFillBot: 'rgba(194, 65, 12, 0.0)',
        halo: 'rgba(251, 146, 60, 0.95)',
        core: '#ffffff'
      },
      green: {
        neon: '#10b981',
        stroke: '#34d399',
        fgGradTop: 'rgba(16, 185, 129, 0.62)',
        fgGradBot: 'rgba(16, 185, 129, 0.0)',
        midFillTop: 'rgba(5, 150, 105, 0.35)',
        midFillBot: 'rgba(5, 150, 105, 0.0)',
        bgFillTop: 'rgba(4, 120, 87, 0.20)',
        bgFillBot: 'rgba(4, 120, 87, 0.0)',
        halo: 'rgba(52, 211, 153, 0.95)',
        core: '#ffffff'
      },
      blue: {
        neon: '#2563eb',
        stroke: '#60a5fa',
        fgGradTop: 'rgba(37, 99, 235, 0.62)',
        fgGradBot: 'rgba(37, 99, 235, 0.0)',
        midFillTop: 'rgba(29, 78, 216, 0.35)',
        midFillBot: 'rgba(29, 78, 216, 0.0)',
        bgFillTop: 'rgba(30, 64, 175, 0.20)',
        bgFillBot: 'rgba(30, 64, 175, 0.0)',
        halo: 'rgba(96, 165, 250, 0.95)',
        core: '#ffffff'
      }
    };

    const c = palettes[themeColor] || palettes.amber;

    // Boundaries
    const padL = 46;
    const padR = 24;
    const padT = 32;
    const padB = 34;
    const plotW = width - padL - padR;
    const plotH = height - padT - padB;
    const baseY = height - padB;

    const range = (yMax - yMin) || 1;
    const getX = i => padL + (i / Math.max(1, points.length - 1)) * plotW;
    const getY = v => {
      if (typeof v !== 'number' || isNaN(v)) return baseY;
      const clamped = Math.max(yMin, Math.min(yMax, v));
      return baseY - ((clamped - yMin) / range) * plotH;
    };

    const fgCoords = points.map((v, i) => ({ x: getX(i), y: getY(v), v, m: i + 1 }));

    // Midground ridge: offset smooth secondary mountain wave
    const midCoords = fgCoords.map((pt, i) => {
      const factor = 0.70 + 0.16 * Math.sin((i / 11) * Math.PI * 2.2);
      return { x: pt.x, y: Math.min(baseY, baseY - ((baseY - pt.y) * factor)) };
    });

    // Background ridge: deeper undulating mountain wave
    const bgCoords = fgCoords.map((pt, i) => {
      const factor = 0.46 + 0.18 * Math.cos((i / 11) * Math.PI * 1.8);
      return { x: pt.x, y: Math.min(baseY, baseY - ((baseY - pt.y) * factor)) };
    });

    function getSpline(pts) {
      if (!pts || pts.length < 2) return '';
      let d = 'M ' + pts[0].x.toFixed(1) + ' ' + pts[0].y.toFixed(1);
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[i === 0 ? 0 : i - 1];
        const p1 = pts[i];
        const p2 = pts[i + 1];
        const p3 = pts[i + 2 < pts.length ? i + 2 : i + 1];
        const cp1x = p1.x + (p2.x - p0.x) / 4.2;
        const cp1y = p1.y + (p2.y - p0.y) / 4.2;
        const cp2x = p2.x - (p3.x - p1.x) / 4.2;
        const cp2y = p2.y - (p3.y - p1.y) / 4.2;
        d += ' C ' + cp1x.toFixed(1) + ' ' + cp1y.toFixed(1) + ', ' + cp2x.toFixed(1) + ' ' + cp2y.toFixed(1) + ', ' + p2.x.toFixed(1) + ' ' + p2.y.toFixed(1);
      }
      return d;
    }

    const fgLine = getSpline(fgCoords);
    const fgArea = fgLine + ' L ' + fgCoords[fgCoords.length - 1].x.toFixed(1) + ' ' + baseY + ' L ' + fgCoords[0].x.toFixed(1) + ' ' + baseY + ' Z';

    const midLine = getSpline(midCoords);
    const midArea = midLine + ' L ' + midCoords[midCoords.length - 1].x.toFixed(1) + ' ' + baseY + ' L ' + midCoords[0].x.toFixed(1) + ' ' + baseY + ' Z';

    const bgLine = getSpline(bgCoords);
    const bgArea = bgLine + ' L ' + bgCoords[bgCoords.length - 1].x.toFixed(1) + ' ' + baseY + ' L ' + bgCoords[0].x.toFixed(1) + ' ' + baseY + ' Z';

    // Grid lines & Y-ticks
    let yTicksSvg = '';
    yTicks.forEach(tickVal => {
      const yPos = getY(tickVal);
      yTicksSvg += '<line x1="' + padL + '" y1="' + yPos.toFixed(1) + '" x2="' + (width - padR) + '" y2="' + yPos.toFixed(1) + '" stroke="rgba(148, 163, 184, 0.12)" stroke-dasharray="3,4" stroke-width="1" />' +
        '<text x="' + (padL - 8) + '" y="' + (yPos + 3.5).toFixed(1) + '" text-anchor="end" class="luminous-axis-txt">' + tickVal + yUnit + '</text>';
    });

    const baselineSvg = '<line x1="' + padL + '" y1="' + baseY + '" x2="' + (width - padR) + '" y2="' + baseY + '" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1" />';

    // X-axis ticks & labels
    let xTicksSvg = '';
    fgCoords.forEach((pt, i) => {
      const isAct = (i + 1 === activeMonth);
      const monNum = String(i + 1).padStart(2, '0');
      const monName = xLabels[i] || '';
      xTicksSvg += '<line x1="' + pt.x.toFixed(1) + '" y1="' + baseY + '" x2="' + pt.x.toFixed(1) + '" y2="' + (baseY + 4) + '" stroke="' + (isAct ? c.stroke : 'rgba(148, 163, 184, 0.22)') + '" stroke-width="' + (isAct ? '1.5' : '1') + '" />' +
        '<text x="' + pt.x.toFixed(1) + '" y="' + (baseY + 13) + '" text-anchor="middle" class="luminous-tick-idx' + (isAct ? ' active' : '') + '">' + monNum + '</text>' +
        '<text x="' + pt.x.toFixed(1) + '" y="' + (baseY + 23) + '" text-anchor="middle" class="luminous-tick-mon' + (isAct ? ' active' : '') + '">' + monName + '</text>';
    });

    // Milestone Drop Needles & Beacon Nodes
    let milestonesSvg = '';
    milestones.forEach(ms => {
      const idx = ms.monthIndex - 1;
      if (idx < 0 || idx >= fgCoords.length) return;
      const pt = fgCoords[idx];
      const isAct = (ms.monthIndex === activeMonth);
      const needleColor = isAct ? '#ffffff' : c.stroke;
      const beaconStroke = isAct ? '#ffffff' : c.stroke;
      const badgeW = Math.max(46, (ms.label || '').length * 7.5 + 16);

      milestonesSvg += '<!-- Milestone Needle -->' +
        '<g class="luminous-milestone-marker" data-month="' + ms.monthIndex + '">' +
          '<line x1="' + pt.x.toFixed(1) + '" y1="' + pt.y.toFixed(1) + '" x2="' + pt.x.toFixed(1) + '" y2="' + baseY + '" stroke="' + c.stroke + '" stroke-opacity="' + (isAct ? '0.7' : '0.4') + '" stroke-dasharray="2,2" stroke-width="1.2" />' +
          '<!-- Radiant Beacon Node -->' +
          '<circle cx="' + pt.x.toFixed(1) + '" cy="' + pt.y.toFixed(1) + '" r="5.5" fill="' + c.neon + '" opacity="0.45">' +
            '<animate attributeName="r" values="4;9;4" dur="2.4s" repeatCount="indefinite" />' +
            '<animate attributeName="opacity" values="0.55;0.12;0.55" dur="2.4s" repeatCount="indefinite" />' +
          '</circle>' +
          '<circle cx="' + pt.x.toFixed(1) + '" cy="' + pt.y.toFixed(1) + '" r="3.8" fill="' + beaconStroke + '" opacity="0.9" />' +
          '<circle cx="' + pt.x.toFixed(1) + '" cy="' + pt.y.toFixed(1) + '" r="1.8" fill="#ffffff" />' +
          '<!-- Value Callout Pill Badge -->' +
          '<g transform="translate(' + pt.x.toFixed(1) + ', ' + Math.max(12, pt.y - 14).toFixed(1) + ')">' +
            '<rect x="' + (-badgeW / 2).toFixed(1) + '" y="-10" width="' + badgeW.toFixed(1) + '" height="18" rx="9" fill="' + (isAct ? 'rgba(234, 88, 12, 0.95)' : 'rgba(15, 23, 42, 0.88)') + '" stroke="' + c.stroke + '" stroke-width="1" />' +
            '<text x="0" y="0" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="9.5" font-weight="700" font-family="JetBrains Mono, monospace">' + ms.label + '</text>' +
          '</g>' +
          (ms.sub && (baseY - pt.y > 38) ? '<text x="' + pt.x.toFixed(1) + '" y="' + (pt.y + Math.max(16, (baseY - pt.y) * 0.48)).toFixed(1) + '" text-anchor="middle" fill="#cbd5e1" font-size="9" font-weight="600" opacity="0.85">' + ms.sub + '</text>' : '') +
        '</g>';
    });

    return '<div class="luminous-mountain-card" id="' + id + '">' +
      '<svg viewBox="0 0 ' + width + ' ' + height + '" preserveAspectRatio="xMidYMid meet" class="luminous-mountain-svg" aria-label="Luminous Mountain Ridge Trajectory Chart">' +
        '<defs>' +
          '<linearGradient id="fg-grad-' + id + '" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0%" stop-color="' + c.stroke + '" stop-opacity="0.62" />' +
            '<stop offset="50%" stop-color="' + c.neon + '" stop-opacity="0.22" />' +
            '<stop offset="100%" stop-color="' + c.neon + '" stop-opacity="0.0" />' +
          '</linearGradient>' +
          '<linearGradient id="mid-grad-' + id + '" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0%" stop-color="' + c.neon + '" stop-opacity="0.35" />' +
            '<stop offset="100%" stop-color="' + c.neon + '" stop-opacity="0.0" />' +
          '</linearGradient>' +
          '<linearGradient id="bg-grad-' + id + '" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0%" stop-color="' + c.neon + '" stop-opacity="0.18" />' +
            '<stop offset="100%" stop-color="' + c.neon + '" stop-opacity="0.0" />' +
          '</linearGradient>' +
          '<filter id="glow-neon-' + id + '" x="-20%" y="-20%" width="140%" height="140%">' +
            '<feGaussianBlur stdDeviation="2.8" result="blur" />' +
            '<feMerge>' +
              '<feMergeNode in="blur" />' +
              '<feMergeNode in="SourceGraphic" />' +
            '</feMerge>' +
          '</filter>' +
        '</defs>' +
        '<!-- Grid and Baselines -->' +
        yTicksSvg +
        baselineSvg +
        '<!-- Mountain Layer 1: Background Ridge -->' +
        '<path d="' + bgArea + '" fill="url(#bg-grad-' + id + ')" />' +
        '<path d="' + bgLine + '" fill="none" stroke="' + c.neon + '" stroke-opacity="0.28" stroke-width="1" />' +
        '<!-- Mountain Layer 2: Midground Ridge -->' +
        '<path d="' + midArea + '" fill="url(#mid-grad-' + id + ')" />' +
        '<path d="' + midLine + '" fill="none" stroke="' + c.neon + '" stroke-opacity="0.48" stroke-width="1.2" />' +
        '<!-- Mountain Layer 3: Foreground Vibrant Ridge -->' +
        '<path d="' + fgArea + '" fill="url(#fg-grad-' + id + ')" />' +
        '<!-- Glowing Neon Spline Line Across Crest -->' +
        '<path d="' + fgLine + '" fill="none" stroke="' + c.stroke + '" stroke-width="2.2" filter="url(#glow-neon-' + id + ')" vector-effect="non-scaling-stroke" />' +
        '<!-- X Axis Timeline Ticks -->' +
        xTicksSvg +
        '<!-- Milestone Drop Needles & Beacon Nodes -->' +
        milestonesSvg +
      '</svg>' +
    '</div>';
  }

  function getExecutivePosture(monthIndex) {
    const vetoes = scored.filter(r => r.veto);
    const br = vetoes.filter(r => r.rag[monthIndex] === -1);

    // Shared weighted health score (0-100) aligned with lib/calc.js
    let healthScore = null;
    if (typeof DATA.ov?.score?.[monthIndex] === 'number') {
      healthScore = DATA.ov.score[monthIndex];
    } else {
      let sumGreen = 0, sumAmber = 0, sumAll = 0;
      scored.forEach(r => {
        const x = r.rag[monthIndex];
        const w = WT(r);
        if (x === 1) { sumGreen += w; sumAll += w; }
        else if (x === 0) { sumAmber += w; sumAll += w; }
        else if (x === -1) { sumAll += w; }
      });
      healthScore = sumAll > 0 ? Math.round(((sumGreen + 0.5 * sumAmber) / sumAll) * 100) : 0;
    }

    const ovRag = DATA.ov?.overall?.[monthIndex] || (br.length ? 'Red' : (healthScore >= 70 ? 'Green' : (healthScore >= 50 ? 'Amber' : 'Red')));

    // Unified cybersecurity business rules (Single Source of Truth)
    const isBreach = br.length > 0;
    const isRed = isBreach || ovRag === 'Red' || healthScore < 50;
    const isAmber = !isRed && (ovRag === 'Amber' || healthScore < 70);
    const isGreen = !isRed && !isAmber;

    const key = isRed ? 'r' : (isAmber ? 'a' : 'g');
    const color = isRed ? '#ef4444' : (isAmber ? '#f59e0b' : '#10b981');
    const statusText = isBreach ? 'Needs Attention' : (isGreen ? 'Optimal Posture' : (isAmber ? 'Moderate Posture' : 'Needs Attention'));
    const gradeBadge = isBreach ? (br.length + ' Zero-tolerance breach' + (br.length > 1 ? 'es' : '')) : (isGreen ? 'Optimal posture' : (isAmber ? 'Balanced posture' : 'Attention required'));
    const badgeClass = isGreen ? 'optimal' : (isAmber ? 'warning' : 'danger');

    return {
      healthScore,
      breaches: br,
      rag: ovRag,
      key,
      color,
      statusText,
      gradeBadge,
      badgeClass,
      isBreach
    };
  }

  function renderHeader() {

    if (yearDisplay) yearDisplay.textContent = state.year;

    const topPeriod = document.getElementById('top-reporting-period');
