<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <base href="/">
  <title>Brysa · Managed Security Services Performance Dashboard</title>
  
  <!-- Premium Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/client.css?v=48.0">
</head>
<body>

  <!-- Top Executive Strip -->
  <header class="top-strip">
    <div class="top-strip-inner">
      <div class="top-strip-left">
        <div class="brand-monogram-badge" style="display:inline-flex; align-items:center; gap:10px; background:transparent; border:none; box-shadow:none; padding:0;">
          <img src="/logo-symbol.png?v=20261014" alt="A0 Cyber Security" class="brand-a0-img" style="width:28px; height:28px; object-fit:contain; display:block; filter:drop-shadow(0 0 1.5px rgba(255,255,255,0.85));" />
          <span style="font-weight:750; font-size:14px; letter-spacing:0.05em; color:#ffffff;">A0 MSS</span>
        </div>
      </div>
      <div class="top-actions">
        <!-- Month & Year Calendar Selector (Matching Main Page Reference UI) -->
        <div class="month-selector-group" id="month-selector-container">
          <button id="prev-month-btn" class="btn-icon-nav" title="Previous Month" type="button" aria-label="Previous Month">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12.5 15l-5-5 5-5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <button type="button" class="month-picker" id="month-picker-trigger" title="Select Reporting Month">
            <svg class="month-picker-cal-icon" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="4" width="14" height="13" rx="1.5"/>
              <path d="M3 8h14M7 2.3v3M13 2.3v3" stroke-linecap="round"/>
            </svg>
            <span id="month-display-text" class="month-display-text">May 2026</span>
            <svg class="month-picker-caret" viewBox="0 0 20 20" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 8l4 4 4-4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input id="month-input" type="hidden">
          </button>
          <button id="next-month-btn" class="btn-icon-nav" title="Next Month" type="button" aria-label="Next Month">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M7.5 5l5 5-5 5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>

          <!-- Custom Ultra-Modern Dark Glow Calendar Widget (Matching Reference UI) -->
          <div id="custom-calendar-popup" class="cal-card-popup" style="display: none;" role="dialog" aria-label="Calendar month picker">
            <!-- Top Violet Glowing Notch Bar & Arch Cutout -->
            <div class="cal-top-notch-wrap">
              <div class="cal-top-notch-bar"></div>
              <div class="cal-top-notch-arch"></div>
            </div>

            <!-- Ambient Glow Spotlight -->
            <div class="cal-ambient-glow"></div>

            <!-- Header: Chevron Left, Month Year, Chevron Right -->
            <div class="cal-header">
              <button type="button" id="cal-nav-prev" class="cal-nav-btn" title="Previous Month" aria-label="Previous Month">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M15 18l-6-6 6-6"/>
                </svg>
              </button>
              <div id="cal-month-title" class="cal-month-title">May 2026</div>
              <button type="button" id="cal-nav-next" class="cal-nav-btn" title="Next Month" aria-label="Next Month">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 18l6-6-6-6"/>
                </svg>
              </button>
            </div>

            <!-- Year Scroll & Selector Ribbon (Scroll wheel / chevrons) -->
            <div class="cal-year-scroll-wrapper" id="cal-year-scroll-container" title="Scroll mouse wheel to change year">
              <button type="button" id="cal-year-scroll-prev" class="cal-year-nav-btn" title="Previous Year" aria-label="Previous Year">
                <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13L5 8L10 3"/></svg>
              </button>
              <div class="cal-year-track" id="cal-year-track"></div>
              <button type="button" id="cal-year-scroll-next" class="cal-year-nav-btn" title="Next Year" aria-label="Next Year">
                <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3L11 8L6 13"/></svg>
              </button>
            </div>

            <!-- 12-Month Selection Grid (JAN to DEC) -->
            <div id="cal-months-grid" class="cal-months-grid"></div>
          </div>
        </div>

        <!-- Frosted Glass Liquid Theme Toggle -->
        <button type="button" class="theme-glass-toggle" id="theme-toggle-btn" role="switch" aria-checked="false" title="Toggle Light / Dark mode">
          <span class="tgt-track">
            <span class="tgt-knob">
              <span class="tgt-icon-moon">
                <svg viewBox="0 0 24 24" width="16" height="16">
                  <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" fill="#ffffff"/>
                </svg>
              </span>
              <span class="tgt-icon-sun">
                <svg viewBox="0 0 24 24" width="16" height="16">
                  <circle cx="12" cy="12" r="4.2" fill="#ffffff"/>
                  <path d="M12 2.5v2.2M12 19.3v2.2M3.7 12h2.2M18.1 12h2.2M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M5.6 18.4l1.6-1.6M16.8 7.2l1.6-1.6" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
                </svg>
              </span>
            </span>
            <span class="tgt-label" id="theme-btn-text">Light</span>
          </span>
        </button>

        <!-- Print / PDF -->
        <button type="button" class="chrome-pill-btn" id="print-portal-btn" title="Print or save as PDF">
          Print / PDF
        </button>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-inner">
      <div class="hero-brand-block">
        <h1 class="hero-title">Managed Security Services Performance Dashboard</h1>
        <div class="hero-meta-badge-row">
          <span class="hero-last-updated-badge" id="hero-last-updated" title="Date of last data modification or final data entry">
            <svg class="hero-update-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            Last updated: <strong id="last-updated-date">20 Oct 2026</strong>
          </span>
        </div>
        <p class="hero-subtitle">Comprehensive monthly SLA intelligence, threat hunting metrics, incident response posture, and remediations.</p>
      </div>
    </div>
  </section>

  <!-- Top KPI Stats Row (Hero Overlap) -->
  <section class="stats-container" id="hs"></section>

  <!-- Dynamic 12-Month Selector Pills (JAN -> DEC) -->
  <div class="month-pills-bar" id="month-pills" role="tablist" aria-label="Reporting month selector"></div>

  <!-- Sticky Tabs Navigation (Image 1 Style) -->
  <nav class="sticky-tabs">
    <div class="tabs" id="tabs" role="tablist" aria-label="Dashboard sections"></div>
  </nav>

  <!-- Main View Container -->
  <main id="view" class="main-content-view"></main>

  <!-- Slide-out Telemetry Details Drawer Layer -->
  <div id="layer"></div>

  <!-- Chart.js Engine -->
  <script src="/chart.umd.js"></script>
  <script>
    if (!window.Chart) {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"><\/script>');
    }
  </script>

  <!-- Main Dashboard Data Integration & UI Engine -->
  <script src="/client.js?v=48.0"></script>
</body>
</html>
