<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brysa KPI Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="client.css?v=24.0">
  <script src="chart.umd.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div>
        <h1>Brysa KPI Dashboard</h1>
        <p>Managed security service · monthly report, 2026</p>
      </div>
    </div>
    <div class="control-group month-control-group">
      <div class="month-label-row">
        <span class="seg-label" id="mlabel">Reporting month</span>
        <div class="year-control-box" title="Type or scroll any year">
          <button type="button" class="year-nav-arrow prev" id="year-scroll-prev" aria-label="Previous year" title="Previous year">
            <svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13L5 8l5-5"/>
            </svg>
          </button>
          <div class="year-input-wrap">
            <span class="year-prefix">YEAR</span>
            <input type="text" inputmode="numeric" id="year-input" class="year-input" value="2026" maxlength="4" placeholder="YYYY" aria-label="Reporting Year" autocomplete="off">
          </div>
          <button type="button" class="year-nav-arrow next" id="year-scroll-next" aria-label="Next year" title="Next year">
            <svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 3l5 5-5 5"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="month-carousel" role="region" aria-label="Reporting month selector">
        <button type="button" class="month-nav-arrow prev" id="month-scroll-prev" aria-label="Scroll earlier months" title="Scroll left">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13L5 8l5-5"/>
          </svg>
        </button>
        <div class="seg month-scroll-track" id="months" role="group" aria-labelledby="mlabel"></div>
        <button type="button" class="month-nav-arrow next" id="month-scroll-next" aria-label="Scroll later months" title="Scroll right">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3l5 5-5 5"/>
          </svg>
        </button>
      </div>
      <p class="sub" style="margin:6px 0 0;text-align:right">Data last updated <strong style="color:#ffffff;font-weight:600">30 Sep 2026</strong></p>
    </div>
  </div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Dashboard sections"></div>
  <main id="view"></main>
  <div class="foot">
    <span>Figures from the KPI workbook, Feb to May 2026.</span>
    <span>Amber means within 10% of target. Any zero-tolerance breach turns the month Red.</span>
  </div>
</div>
<div id="layer"></div>

<script src="client.js?v=26.0"></script>
</body>
</html>
